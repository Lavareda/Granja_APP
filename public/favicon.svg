<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background — rounded corners, safe for maskable (content within 80% safe zone) -->
  <rect width="512" height="512" rx="96" fill="#2f6f4f"/>

  <!-- Rear large wheel -->
  <circle cx="164" cy="318" r="104" fill="none" stroke="white" stroke-width="24"/>
  <circle cx="164" cy="318" r="32" fill="white"/>

  <!-- Front small wheel -->
  <circle cx="360" cy="348" r="62" fill="none" stroke="white" stroke-width="20"/>
  <circle cx="360" cy="348" r="18" fill="white"/>

  <!-- Chassis / axle bar connecting wheels -->
  <rect x="150" y="306" width="222" height="24" rx="10" fill="white"/>

  <!-- Tractor cab body -->
  <rect x="150" y="228" width="122" height="90" rx="10" fill="white"/>

  <!-- Engine hood -->
  <rect x="260" y="244" width="104" height="74" rx="8" fill="white"/>

  <!-- Cab window (dark cutout) -->
  <rect x="160" y="238" width="106" height="72" rx="6" fill="#1a5438"/>

  <!-- Exhaust pipe -->
  <rect x="340" y="188" width="20" height="60" rx="8" fill="white"/>
  <ellipse cx="350" cy="187" rx="14" ry="6" fill="white"/>

  <!-- Exhaust smoke puffs -->
  <circle cx="350" cy="171" r="11" fill="white" opacity="0.65"/>
  <circle cx="358" cy="157" r="8"  fill="white" opacity="0.4"/>
</svg>
